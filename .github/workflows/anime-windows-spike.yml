name: Anime Windows spike

# Throwaway: checks how ani-cli behaves under BusyBox for Windows before the anime section is ported (see docs/DECISIONS.md).
# It mimics the isolated environment the app gives ani-cli: only the bundled folders on Path plus a few system variables.
on:
  workflow_dispatch:
  push:
    branches: [feature/anime-windows]
    paths: ['.github/workflows/anime-windows-spike.yml', 'scripts/spike/**', 'resources/ani-scripts/**']

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch yt-dlp, ffmpeg and deno
        run: node scripts/fetch-binaries.mjs --platform=win32

      - name: Fetch busybox-w32, curl and ani-cli (pinned, checksum verified)
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'resources/bin'
          $ani = Join-Path $bin 'ani'
          New-Item -ItemType Directory -Force $ani | Out-Null
          function Get-Verified($url, $out, $sha) {
            Invoke-WebRequest -Uri $url -OutFile $out -UserAgent 'pullwave-build'
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $sha) { throw "sha256 mismatch for ${url}: $actual" }
          }
          Get-Verified 'https://frippery.org/files/busybox/busybox-w64u-FRP-6075-g169694ebd.exe' "$ani/busybox.exe" '6e263d154d8548d1eb936f65d1d8312c80df31c45974e48d6335e4dcc0f4f34c'
          Get-Verified 'https://github.com/stunnel/static-curl/releases/download/8.22.0/curl-windows-x86_64-8.22.0.tar.xz' "$env:RUNNER_TEMP/curl.tar.xz" '8a57d1a52ea246f50be9e3f24a1d539d4fd23884405efbe18c6eb44eaf8ca524'
          Get-Verified 'https://raw.githubusercontent.com/pystardust/ani-cli/3ad53631ef2433b0c26e25ab011a5b149706c120/ani-cli' "$ani/ani-cli" '32ae0965b7abb102ab85f381411b980d1a9196f06bf2756d48fef16695b41d47'
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP/curl.tar.xz" -C $ani curl.exe
          Get-ChildItem $ani | Format-Table Name, Length
          # The checkout must have kept LF in the scripts.
          foreach ($f in 'resources/ani-scripts/pullwave-run.sh','scripts/spike/anime-windows-spike.sh','resources/bin/ani/ani-cli') {
            $text = [IO.File]::ReadAllText((Join-Path $PWD $f))
            "{0}: CRLF present = {1}" -f $f, $text.Contains("`r`n")
          }

      - name: Run the checks under busybox.exe with the app's isolated environment
        shell: pwsh
        run: |
          $root = $PWD.Path -replace '\\','/'
          $bin = Join-Path $PWD 'resources/bin'
          function Invoke-Strict([string[]]$arguments, [hashtable]$extra) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = "$bin\ani\busybox.exe"
            foreach ($a in $arguments) { [void]$psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.EnvironmentVariables.Clear()
            foreach ($k in 'SystemRoot','windir','TEMP','TMP','USERPROFILE','APPDATA','LOCALAPPDATA','ProgramData','PATHEXT','COMSPEC','HOMEDRIVE','HOMEPATH') {
              $v = [Environment]::GetEnvironmentVariable($k)
              if ($v) { $psi.EnvironmentVariables[$k] = $v }
            }
            $psi.EnvironmentVariables['Path'] = "$bin;$bin\ani"
            foreach ($k in $extra.Keys) { $psi.EnvironmentVariables[$k] = $extra[$k] }
            $p = [System.Diagnostics.Process]::Start($psi)
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            $p.WaitForExit()
            "--- exit code $($p.ExitCode)"
            $out.Result
            "--- stderr"
            $err.Result
          }
          $hist = "$env:RUNNER_TEMP/ani-hist" -replace '\\','/'
          $dl = "$env:RUNNER_TEMP/ani-dl" -replace '\\','/'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ani-dl" | Out-Null
          $common = @{ ANI_CLI_MENU = 'pullwave_menu'; ANI_CLI_PLAYER = 'pullwave_noplayer'; ANI_CLI_LOG = '0'; ANI_CLI_MODE = 'sub'; ANI_CLI_HIST_DIR = $hist; ANI_CLI_DOWNLOAD_DIR = $dl }
          $run = "$root/resources/ani-scripts/pullwave-run.sh"
          $ani = "$root/resources/bin/ani/ani-cli"

          "##### basic checks"
          Invoke-Strict @('sh', "$root/scripts/spike/anime-windows-spike.sh") @{}

          "##### search (menu function)"
          Invoke-Strict @('sh', $run, $ani, 'cyberpunk', 'edgerunners') $common

          "##### episodes of the first result"
          Invoke-Strict @('sh', $run, $ani, '-S', '1', 'cyberpunk', 'edgerunners') $common

          "##### address of episode 1 (debug player)"
          $debug = $common.Clone()
          $debug['ANI_CLI_PLAYER'] = 'debug'
          Invoke-Strict @('sh', $run, $ani, '-S', '1', '-e', '1', '-q', 'worst', 'cyberpunk', 'edgerunners') $debug

          "##### download episode 1 at the lowest quality"
          Invoke-Strict @('sh', $run, $ani, '-d', '-S', '1', '-e', '1', '-q', 'worst', 'cyberpunk', 'edgerunners') $common | Select-Object -Last 25
          Get-ChildItem "$env:RUNNER_TEMP/ani-dl" | Format-Table Name, Length

          "##### the script still parses under busybox.exe after a change (sh -n)"
          Invoke-Strict @('sh', '-n', $ani) @{}
          "##### a download that is cancelled: the whole tree must go"
          $slow = $common.Clone()
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "$bin\ani\busybox.exe"
          foreach ($a in @('sh', '-c', 'sleep 60 & sleep 60')) { [void]$psi.ArgumentList.Add($a) }
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 2
          "children before: " + (Get-CimInstance Win32_Process -Filter "ParentProcessId=$($proc.Id)" | Measure-Object).Count
          & "$env:SystemRoot\System32\taskkill.exe" /PID $proc.Id /T /F | Out-Null
          Start-Sleep -Seconds 1
          "busybox processes left after taskkill /T /F: " + (Get-Process busybox -ErrorAction SilentlyContinue | Measure-Object).Count
