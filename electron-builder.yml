appId: dev.lucas.pullwave
productName: Pullwave
artifactName: pullwave-${version}.${ext}
directories:
  output: dist
publish:
  provider: github
  owner: monothread
  repo: pullwave
files:
  - out/**/*
  - package.json
  - resources/icon.png
icon: resources/icon.png
linux:
  # ffmpeg/ffprobe on Linux are the shared build: the programs are in bin, their libraries in ../lib.
  extraResources:
    - from: resources/bin
      to: bin
    - from: resources/lib
      to: lib
    # The anime section (ani-cli): the script that wraps it with stand-ins for the menu, the player and tput. The tools it
    # runs on (busybox, curl, ani-cli) are in resources/bin/ani, copied with the rest of bin.
    - from: resources/ani-scripts
      to: ani-scripts
    - from: resources/THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
  # One build must produce every Linux package: latest-linux.yml has to list all of them so that the
  # in-app updater finds its own file type (AppImage, deb, rpm for Fedora, pacman for Arch).
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  category: Network
  syncDesktopName: true
  maintainer: monothread <realrukasu@proton.me>
  synopsis: Cyberpunk yt-dlp GUI and video downloader
win:
  extraResources:
    - from: resources/bin
      to: bin
    - from: resources/ani-scripts
      to: ani-scripts
    - from: resources/THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: pullwave-${version}-setup.${ext}
  deleteAppDataOnUninstall: false
